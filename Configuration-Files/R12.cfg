################### IXR System Config #############################
exit all
configure
    system
        name "R12"
        contact "Noc-Center"
        location "Toronto Downtown"
        config-backup 5
        management-interface
            configuration-mode classic
        exit
        snmp
            engineID "000000000000010101010010"
            packet-size 9216
            no shutdown
        exit
        time
            ntp
                no shutdown
            exit
            sntp
                shutdown
            exit
            dst-zone EDT
                start second sunday march 02:00
                end first sunday november 02:00
            exit
            zone EST
        exit
        thresholds
            rmon
                alarm 5 variable-oid sgiCpuUsage.0 interval 10 startup-alarm rising rising-threshold 80 falling-threshold 75 owner "CA-PU-TOR"
            exit
            cflash-cap-alarm-pct cf3-A: rising-threshold 80 falling-threshold 75 interval 3600
        exit
        lldp
            tx-interval 10
            tx-hold-multiplier 2
            reinit-delay 5
            notification-interval 10
        exit
    exit
    redundancy
        synchronize boot-env
    exit all
