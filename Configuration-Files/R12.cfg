################## IXR Log Config #####################################################
exit all
configure
    system
        login-control
            idle-timeout 15
            pre-login-message "**************************************************************************\n\r*                                                                        *\n\r*                              WARNING                                   *\n\r*                                                                        *\n\r*  UNAUTHORIZED ACCESS TO THIS NETWORK DEVICE IS PROHIBITED. You must    *\n\r*  have explicit permission to access or configure this device. All      *\n\r*  activities performed on this device may be logged, and violations of  *\n\r*  this policy may result in disciplinary action, and may be reported    *\n\r*  to law enforcement. There is no right to privacy on this device.      *\n\r*                                                                        *\n\r**************************************************************************"
            exponential-backoff
        exit
    exit
    log
        file-id 20 name "20"
            description "logging all system activity"
            location cf3:
            rollover 10080 retention 168
        exit
        syslog 1 name "1"
            address 30.30.30.30
            facility local0
            level debug
        exit
        log-id 1 name "1"
            shutdown
            description "Pending"
            time-format local
            from main security change
            to syslog 1
            no shutdown
        exit
        log-id 20 name "20"
            description "logging from Main Change and Security events"
            time-format local
            from main security change
            to file 20
            no shutdown
        exit
        log-id 98 name "98"
            from main security change
            to snmp 1024
            no shutdown
        exit
    exit all
